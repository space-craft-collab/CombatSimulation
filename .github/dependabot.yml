version: 2

updates:
  # NuGet versions live in Directory.Packages.props (Central
  # Package Management) — Dependabot edits that file directly.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      orleans:
        patterns: ["Microsoft.Orleans.*"]
      aspnetcore-and-ef:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"
          - "NetArchTest.*"
          - "NSubstitute"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
