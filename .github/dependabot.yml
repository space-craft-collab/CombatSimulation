version: 2

updates:
  # NuGet versions live in Directory.Packages.props (Central
  # Package Management) — Dependabot edits that file directly.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The framework packages follow the TFM (net10.0); a major
    # bump (e.g. 11.0.0) belongs to a deliberate TFM upgrade.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # The EF CLI tool (.config/dotnet-tools.json) follows EF Core.
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      orleans:
        patterns: ["Microsoft.Orleans.*"]
      aspnetcore-and-ef:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      # NLog.Extensions.Logging pulls a matching NLog core; with
      # transitive pinning they must move together.
      nlog:
        patterns: ["NLog*"]
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"
          - "NetArchTest.*"
          - "NSubstitute"
          # Coverage tools (.config/dotnet-tools.json).
          - "dotnet-coverage"
          - "dotnet-reportgenerator-globaltool"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The Azurite and SQL Server images pinned in compose.yaml; the
  # tests read their images from that file, so CI checks a bump.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  # The frontend's npm packages, all pinned to exact versions. A
  # release has to be a week old, like frontend/.npmrc demands;
  # each PR still gets the malware check (CONTRIBUTING.md).
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Follows the Node major of frontend/Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Follows the server's .NET major.
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]
      # A TypeScript major has to be supported by svelte-check and
      # typescript-eslint first; it is raised by hand then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # The Kiota runtime packages are released together.
      kiota:
        patterns: ["@microsoft/kiota-*"]
      svelte:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "vite"
          - "vitest"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      lint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier*"
          - "globals"

  # The Node image of frontend/Dockerfile. The Playwright image in
  # frontend/compose.yaml is bumped by hand, together with
  # @playwright/test.
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    ignore:
      # Node majors are a deliberate step (LTS to LTS).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
