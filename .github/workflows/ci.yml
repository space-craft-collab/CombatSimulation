name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build only needs to read the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # A run takes about two minutes; a hung container or test
    # must not hold the runner for GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # dotnet-coverage and reportgenerator, pinned in
      # .config/dotnet-tools.json.
      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # xUnit v3 test projects are executables; run them
      # directly instead of going through dotnet test/VSTest.
      # Integration scenarios run in their own job instead, so
      # this job stays fast and fails first. dotnet-coverage wraps
      # the run and passes its exit code on.
      - name: Test
        run: >-
          dotnet dotnet-coverage collect
          --settings tests/coverage.settings.xml
          --output coverage/fast.cobertura.xml
          --output-format cobertura
          --
          dotnet run --no-build --configuration Release
          --project tests/OrleansMonsterArena.Tests
          -- -trait- "Category=Integration"

      # Coverage of the fast suite only: what just the
      # integration job reaches (the Table Storage wiring)
      # shows as uncovered here.
      - name: Coverage report
        run: |
          dotnet reportgenerator \
            -reports:coverage/fast.cobertura.xml \
            -targetdir:coverage/report \
            "-reporttypes:Html;MarkdownSummaryGithub"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report

      # The frontend's Kiota client is generated from
      # docs/api/openapi.json and checked in (ADR-0004); the tests
      # above keep that document equal to what the host serves.
      - name: API client is up to date
        run: |
          scripts/generate-api-client.sh
          if [ -n "$(git status --porcelain -- frontend/src/lib/api)" ]; then
            git status --short -- frontend/src/lib/api
            echo "::error::frontend/src/lib/api is stale: run scripts/generate-api-client.sh and commit the result."
            exit 1
          fi

  # Testcontainers suites (Docker is preinstalled on the runner).
  # Runs only after build-test passes. All four jobs of this
  # file are required checks on main.
  integration:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (integration)
        run: >-
          dotnet run --no-build --configuration Release
          --project tests/OrleansMonsterArena.Tests
          -- -trait "Category=Integration"

  # The SvelteKit frontend. Node and npm exist only in the image
  # frontend/Dockerfile pins, so every step runs in that container,
  # with the commands a developer uses (frontend/compose.yaml).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The container writes into the checkout, so it runs as the
      # runner's user.
      - name: Container user
        run: |
          echo "FRONTEND_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "FRONTEND_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the toolchain image
        run: docker compose build frontend

      # Before anything is installed: no package in the lockfile
      # is listed as malware (CONTRIBUTING.md).
      - name: Malware check
        run: docker compose run --rm frontend node scripts/check-malware.mjs

      - name: Install
        run: docker compose run --rm frontend npm ci

      - name: Lint
        run: docker compose run --rm frontend npm run lint

      - name: Type check
        run: docker compose run --rm frontend npm run check

      - name: Test
        run: docker compose run --rm frontend npm test

      - name: Build
        run: docker compose run --rm frontend npm run build

  # The Playwright tests (frontend/e2e) against the whole app, started
  # the way a developer starts it for a round in the browser
  # (scripts/play-start.sh): SQL Server and Azurite, the AppHost, and
  # the frontend dev server. Runs only after the build, the fast tests
  # and the frontend's checks pass, next to the integration job.
  e2e:
    needs: [build-test, frontend]
    runs-on: ubuntu-latest
    # About eight minutes, most of it image pulls and builds on a cold
    # runner.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The containers write into the checkout, so they run as the
      # runner's user.
      - name: Container user
        run: |
          echo "FRONTEND_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "FRONTEND_GID=$(id -g)" >> "$GITHUB_ENV"

      # Where play-start.sh keeps the AppHost's log, for the failure
      # steps below. Set in a step: a job's env cannot read the
      # runner context.
      - name: State directory
        run: echo "OMA_PLAY_DIR=$RUNNER_TEMP/oma-play" >> "$GITHUB_ENV"

      # A step of its own, so the time a cold runner spends on the
      # images shows apart from the start and the tests. The root
      # compose.yaml insists on the password even to pull; its value
      # does not matter here.
      - name: Pull images
        env:
          MSSQL_SA_PASSWORD: unused
        run: |
          docker compose -f ../compose.yaml pull --quiet
          docker compose --profile e2e pull --quiet e2e

      - name: Build the toolchain image
        run: docker compose build frontend

      # Before anything is installed (CONTRIBUTING.md).
      - name: Malware check
        run: docker compose run --rm frontend node scripts/check-malware.mjs

      - name: Install
        run: docker compose run --rm frontend npm ci

      # Builds and starts the AppHost and the dev server, and waits
      # until both answer.
      - name: Start the app
        run: ../scripts/play-start.sh

      - name: Test (e2e)
        run: docker compose run --rm e2e

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          if [ -f "$OMA_PLAY_DIR/apphost.log" ]; then
            cp "$OMA_PLAY_DIR/apphost.log" "$RUNNER_TEMP/e2e-logs/"
          fi
          docker compose logs --no-color frontend > "$RUNNER_TEMP/e2e-logs/frontend.log" 2>&1
          MSSQL_SA_PASSWORD=unused docker compose -f ../compose.yaml -p oma-play logs --no-color \
            > "$RUNNER_TEMP/e2e-logs/infrastructure.log" 2>&1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs

      # Traces of failed attempts, a flaky test's included: open them
      # with `npx playwright show-trace`. A green run leaves only the
      # hidden .last-run.json, which upload-artifact skips, so it
      # uploads nothing.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-traces
          path: frontend/test-results
          if-no-files-found: ignore
