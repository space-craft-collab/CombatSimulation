name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build only needs to read the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # xUnit v3 test projects are executables; run them
      # directly instead of going through dotnet test/VSTest.
      # Integration scenarios run in their own job instead, so
      # this required check stays fast.
      - name: Test
        run: >-
          dotnet run --no-build --configuration Release
          --project tests/OrleansMonsterArena.Tests
          -- -trait- "Category=Integration"

  # Testcontainers suites (Docker is preinstalled on the runner).
  # Runs only after build-test passes and is not a required check.
  integration:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (integration)
        run: >-
          dotnet run --no-build --configuration Release
          --project tests/OrleansMonsterArena.Tests
          -- -trait "Category=Integration"
