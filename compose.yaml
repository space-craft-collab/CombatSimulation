# Local infrastructure for Phase 3 (hot/cold persistence).
#
#   cp .env.example .env                       # set the SQL password
#   cp src/AppHost/appsettings.Development.example.json \
#      src/AppHost/appsettings.Development.json
#   docker compose up -d
#   dotnet run --project src/AppHost
#
# Without these steps the host still runs on in-memory storage.
# Ports bind to localhost only.

name: orleans-monster-arena

services:
  # Hot path: Orleans grain state and reminders (Table Storage).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-table --tableHost 0.0.0.0 --location /data
    ports:
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data

  # Cold path: EF Core, one schema per module.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  azurite-data:
  sqlserver-data:
